<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051610" />
      <stop offset="50%" stop-color="#071b26" />
      <stop offset="100%" stop-color="#09142b" />
    </linearGradient>

    <!-- Mesh Glows -->
    <radialGradient id="greenGlow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyanGlow" cx="80%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e2838" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#081824" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Filter for soft shadows & glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1600" height="900" fill="url(#bgGrad)" />
  <rect width="1600" height="900" fill="url(#greenGlow)" />
  <rect width="1600" height="900" fill="url(#cyanGlow)" />

  <!-- Topographic Contour Lines -->
  <g stroke="#10b981" stroke-opacity="0.08" stroke-width="1.5" fill="none">
    <path d="M-100 200 C 300 100, 600 350, 1100 150 C 1350 50, 1500 250, 1800 180" />
    <path d="M-100 320 C 250 200, 700 450, 1150 260 C 1400 170, 1600 360, 1800 300" />
    <path d="M-100 440 C 350 350, 750 580, 1200 400 C 1450 320, 1650 500, 1800 440" />
    <path d="M-100 580 C 400 500, 800 700, 1300 550 C 1500 500, 1700 640, 1800 600" />
  </g>

  <!-- High-Tech Coordinate Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="900" />
    <line x1="300" y1="0" x2="300" y2="900" />
    <line x1="500" y1="0" x2="500" y2="900" />
    <line x1="700" y1="0" x2="700" y2="900" />
    <line x1="900" y1="0" x2="900" y2="900" />
    <line x1="1100" y1="0" x2="1100" y2="900" />
    <line x1="1300" y1="0" x2="1300" y2="900" />
    <line x1="1500" y1="0" x2="1500" y2="900" />
    <line x1="0" y1="150" x2="1600" y2="150" />
    <line x1="0" y1="300" x2="1600" y2="300" />
    <line x1="0" y1="450" x2="1600" y2="450" />
    <line x1="0" y1="600" x2="1600" y2="600" />
    <line x1="0" y1="750" x2="1600" y2="750" />
  </g>

  <!-- Top System Telemetry Bar -->
  <g transform="translate(100, 60)">
    <rect x="0" y="0" width="1400" height="50" rx="10" fill="#081824" fill-opacity="0.8" stroke="#10b981" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="28" cy="25" r="6" fill="#10b981" />
    <text x="46" y="30" font-family="monospace" font-size="14" fill="#a7f3d0" font-weight="700" letter-spacing="1.5">STEPS AI ENGINE // NORTH &amp; PINE AUTONOMOUS LOGISTICS DISPATCH</text>
    <text x="1240" y="30" font-family="monospace" font-size="13" fill="#38bdf8" font-weight="600">SYS_STATUS: ACTIVE · 24/7</text>
  </g>

  <!-- Central Visual: Isometric Logistics Nodes -->
  <g transform="translate(240, 160)">
    <!-- Connection Network Lines -->
    <path d="M 120 220 L 380 140 L 700 240 L 980 160" stroke="url(#accentGrad)" stroke-width="3" fill="none" stroke-dasharray="8,6" opacity="0.8" />
    <path d="M 380 140 L 460 380 L 700 240" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.5" />

    <!-- Node 1: Warehouse Origin -->
    <g transform="translate(120, 220)">
      <circle cx="0" cy="0" r="32" fill="#064e3b" stroke="#10b981" stroke-width="2" />
      <circle cx="0" cy="0" r="14" fill="#10b981" filter="url(#softGlow)" />
      <text x="0" y="55" font-family="sans-serif" font-size="13" fill="#a7f3d0" font-weight="700" text-anchor="middle">FULFILLMENT HUB</text>
      <text x="0" y="72" font-family="monospace" font-size="11" fill="#6ee7b7" text-anchor="middle">SEATTLE, WA</text>
    </g>

    <!-- Node 2: Courier API Webhook Router -->
    <g transform="translate(380, 140)">
      <circle cx="0" cy="0" r="36" fill="#082f49" stroke="#38bdf8" stroke-width="2" />
      <circle cx="0" cy="0" r="16" fill="#38bdf8" filter="url(#softGlow)" />
      <text x="0" y="60" font-family="sans-serif" font-size="13" fill="#bae6fd" font-weight="700" text-anchor="middle">AUTONOMOUS ROUTER</text>
      <text x="0" y="77" font-family="monospace" font-size="11" fill="#7dd3fc" text-anchor="middle">&lt; 15s WEBHOOK</text>
    </g>

    <!-- Node 3: Real-Time Parcel Telemetry -->
    <g transform="translate(700, 240)">
      <circle cx="0" cy="0" r="42" fill="#0f172a" stroke="#10b981" stroke-width="2.5" />
      <circle cx="0" cy="0" r="20" fill="#10b981" filter="url(#softGlow)" />
      <text x="0" y="68" font-family="sans-serif" font-size="14" fill="#34d399" font-weight="700" text-anchor="middle">LIVE SHIPMENT SYNC</text>
      <text x="0" y="86" font-family="monospace" font-size="11" fill="#6ee7b7" text-anchor="middle">88% FIRST-CONTACT RESOLVED</text>
    </g>

    <!-- Node 4: End Customer Verified Delivery -->
    <g transform="translate(980, 160)">
      <circle cx="0" cy="0" r="32" fill="#064e3b" stroke="#34d399" stroke-width="2" />
      <circle cx="0" cy="0" r="14" fill="#34d399" filter="url(#softGlow)" />
      <text x="0" y="55" font-family="sans-serif" font-size="13" fill="#a7f3d0" font-weight="700" text-anchor="middle">DELIVERY CONFIRMED</text>
      <text x="0" y="72" font-family="monospace" font-size="11" fill="#6ee7b7" text-anchor="middle">ZERO TICKET ESCALATION</text>
    </g>
  </g>

  <!-- Bottom Telemetry HUD Widgets -->
  <g transform="translate(100, 560)">
    <!-- Widget 1: Courier Webhook Feed -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="440" height="230" rx="14" fill="url(#cardGrad)" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5" />
      <rect x="18" y="18" width="8" height="8" rx="4" fill="#10b981" />
      <text x="34" y="26" font-family="sans-serif" font-size="12" fill="#a7f3d0" font-weight="700" letter-spacing="1">LIVE CARRIER API FEED</text>
      
      <g transform="translate(18, 55)" font-family="monospace" font-size="11.5">
        <text y="0" fill="#7dd3fc">→ POST /api/carrier/webhook [200 OK]</text>
        <text y="24" fill="#94a3b8">  Order #NP-48192 · Package in Transit</text>
        <text y="48" fill="#10b981">✓ Proactive SMS Dispatched to Customer</text>
        <text y="72" fill="#7dd3fc">→ GET /order/track/auth [VERIFIED]</text>
        <text y="96" fill="#94a3b8">  ETA: Today by 3:45 PM · On Schedule</text>
        <text y="120" fill="#a7f3d0">✓ Autonomous Resolution Completed</text>
        <text y="144" fill="#6ee7b7">  Human Intervention: 0% Required</text>
      </g>
    </g>

    <!-- Widget 2: Operational Impact Radar -->
    <g transform="translate(480, 0)">
      <rect x="0" y="0" width="440" height="230" rx="14" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" />
      <rect x="18" y="18" width="8" height="8" rx="4" fill="#38bdf8" />
      <text x="34" y="26" font-family="sans-serif" font-size="12" fill="#bae6fd" font-weight="700" letter-spacing="1">WEEKLY SUPPORT HOURS SAVED</text>
      
      <!-- Big Metric -->
      <text x="24" y="95" font-family="sans-serif" font-size="48" font-weight="800" fill="#ffffff">60+ hrs</text>
      <text x="220" y="85" font-family="sans-serif" font-size="14" font-weight="600" fill="#38bdf8">Reclaimed Every Week</text>
      
      <!-- Progress Bar 1 -->
      <text x="24" y="138" font-family="sans-serif" font-size="12" fill="#94a3b8">Tier-1 Order Ticket Automation</text>
      <text x="370" y="138" font-family="monospace" font-size="12" fill="#10b981" font-weight="700">80%</text>
      <rect x="24" y="148" width="390" height="8" rx="4" fill="#1e293b" />
      <rect x="24" y="148" width="312" height="8" rx="4" fill="#10b981" />
      
      <!-- Progress Bar 2 -->
      <text x="24" y="186" font-family="sans-serif" font-size="12" fill="#94a3b8">First-Contact Resolution Rate</text>
      <text x="370" y="186" font-family="monospace" font-size="12" fill="#38bdf8" font-weight="700">88%</text>
      <rect x="24" y="196" width="390" height="8" rx="4" fill="#1e293b" />
      <rect x="24" y="196" width="343" height="8" rx="4" fill="#38bdf8" />
    </g>

    <!-- Widget 3: Channel Matrix -->
    <g transform="translate(960, 0)">
      <rect x="0" y="0" width="440" height="230" rx="14" fill="url(#cardGrad)" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5" />
      <rect x="18" y="18" width="8" height="8" rx="4" fill="#10b981" />
      <text x="34" y="26" font-family="sans-serif" font-size="12" fill="#a7f3d0" font-weight="700" letter-spacing="1">ACTIVE DEPLOYMENT CHANNELS</text>
      
      <!-- 3 Channels -->
      <g transform="translate(20, 52)">
        <rect x="0" y="0" width="400" height="44" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <circle cx="22" cy="22" r="5" fill="#10b981" />
        <text x="38" y="27" font-family="sans-serif" font-size="13" font-weight="600" fill="#ffffff">Website Help Widget</text>
        <text x="385" y="27" font-family="monospace" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="end">&lt; 10s</text>
      </g>
      <g transform="translate(20, 106)">
        <rect x="0" y="0" width="400" height="44" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <circle cx="22" cy="22" r="5" fill="#10b981" />
        <text x="38" y="27" font-family="sans-serif" font-size="13" font-weight="600" fill="#ffffff">Automated Email Replies</text>
        <text x="385" y="27" font-family="monospace" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="end">Instant</text>
      </g>
      <g transform="translate(20, 160)">
        <rect x="0" y="0" width="400" height="44" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <circle cx="22" cy="22" r="5" fill="#10b981" />
        <text x="38" y="27" font-family="sans-serif" font-size="13" font-weight="600" fill="#ffffff">Proactive SMS Dispatch Updates</text>
        <text x="385" y="27" font-family="monospace" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="end">100% Sync</text>
      </g>
    </g>
  </g>
</svg>
